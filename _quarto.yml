website:
  title: "I5TSA | Time Series Analysis"
  description: "R practicals and assignments for Time Series Analysis"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Course Practice
        menu:
          - text: "Ch 01 · Introduction"
            href: practice/ch01-introduction.qmd
          - text: "Ch 04 · Empirical AR(p) Modeling (Lynx)"
            href: practice/tsa-empirical-ar.qmd
          - text: "Ch 05 · Financial AR(p) Modeling (EuStockMarkets)"
            href: practice/tsa-financial-ar.qmd
          - text: "Gold Price Forecasting (5 Models)"
            href: practice/Gold_Price_Forecasting.qmd
      - text: Practicals
        menu:
          - text: "TP 01 · Introduction"
            href: TP01/tp01.qmd
          - text: "TP 02 · Mathematical foundations"
            href: TP02/tp02.qmd
      - text: Assignments
        href: assignments/index.qmd
