project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - practice/ch01-introduction.qmd
    - practice/tsa-empirical-ar.qmd
    - practice/tsa-financial-ar.qmd
    - practice/Gold_Price_Forecasting.qmd
    - TP01/tp01.qmd
